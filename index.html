<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Armurerie Marz</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one search bar on top, the selected weapon (or attachment) below as a dossier,
   its attachments grouped by kind in a responsive grid. Single dark theme, on purpose. */
:root {
  --bg: #1c2127;        /* slate, not black */
  --surface: #252b33;
  --raise: #2e353f;
  --line: #3a434f;
  --fg: #e6e9ed;
  --muted: #9aa4b1;
  --accent: #7fb9c9;    /* muted teal: best choice, links */
  --accent-ink: #1c2127;
  --vanilla: #e2c75e;   /* yellow border: base-game weapon */
  --broken: #e2786a;    /* red border: does not work in B42 */
  --good: #8cc7a3;
  --bad: #de9682;
  --focus: #9fc0e4;
  --panel: #20262d;
  --modammo: #b79be6;   /* violet dot: the mod's own rounds */     /* the three framed blocks */
  --font-display: "Chakra Petch", "Bahnschrift", "Segoe UI", sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", "Cascadia Mono", Consolas, monospace;
  --radius: 10px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.45; margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
/* ---------- app shell: only the categories and the content scroll, each on its own */
.app {
  max-width: 1500px; margin: 0 auto; height: 100vh; height: 100dvh; display: grid; gap: 14px 16px;
  grid-template-columns: 236px minmax(0, 1fr) 220px; grid-template-rows: auto minmax(0, 1fr);
  grid-template-areas: "top top lang" "side main rail"; padding-block: 14px;
}
body:has(.app) { overflow: hidden; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
.langcell { grid-area: lang; }
.lang { width: 100%; }
.side { grid-area: side; min-height: 0; overflow: auto; overscroll-behavior: contain; padding: 14px 10px; }
.content { grid-area: main; min-height: 0; overflow: auto; overscroll-behavior: contain; padding: 0 18px 24px; }
.rail { grid-area: rail; min-height: 0; overflow: auto; }
.legendbox { padding: 14px; }
.legendbox h4 { font-family: var(--font-display); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); margin: 0 0 10px; }
.keys { list-style: none; margin: 0 0 12px; padding: 0; display: grid; gap: 8px; font-size: 13px; }
.keys li { display: flex; align-items: center; gap: 8px; }
.key { flex: none; width: 16px; height: 16px; border-radius: 4px; border: 2px solid; }
.key.vanilla { border-color: var(--vanilla); }
.key.broken { border-color: var(--broken); }
.key.swap { border-color: color-mix(in srgb, var(--bad) 60%, var(--line)); background: var(--surface); }
.adot { display: inline-block; flex: none; width: 9px; height: 9px; border-radius: 50%; margin-inline-end: 6px; vertical-align: 1px; }
.adot.v { background: var(--vanilla); }
.adot.m { background: var(--modammo); }
.keys .adot { margin-inline: 4px 3px; }
.bestpill { padding: 1px 8px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-size: 11px; font-weight: 600; }
.scale { height: 8px; border-radius: 999px; margin: 4px 0 6px; background: linear-gradient(to right, hsl(0 55% 64%), hsl(62 55% 64%), hsl(125 55% 64%)); }
[dir="rtl"] .scale { transform: scaleX(-1); }
.small { font-size: 12.5px; color: var(--muted); margin: 0 0 8px; }
.recent-l { font-size: 12.5px; color: var(--muted); align-self: center; }

/* ---------- header + search */
header.top { grid-area: top; position: relative; z-index: 5; }
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.brand h1 { font-family: var(--font-display); font-weight: 700; font-size: 26px; letter-spacing: .04em; margin: 0; text-transform: uppercase; }
.brand h1 span { color: var(--accent); }
.brand h1 .port { font-size: .55em; letter-spacing: .02em; color: var(--muted); text-transform: none; white-space: nowrap; }
.brand p { margin: 0; color: var(--muted); font-size: 13px; }
.lang { font: inherit; font-size: 13px; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; }
.lang:focus-visible { outline: 2px solid var(--focus); }
.search { position: relative; }
.search input {
  width: 100%; font: inherit; font-size: 17px; color: var(--fg); background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--radius); padding-block: 12px; padding-inline: 44px 14px;
}
.search input:focus { outline: 2px solid var(--focus); outline-offset: 1px; }
.search svg { position: absolute; inset-inline-start: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; fill: var(--muted); pointer-events: none; }
.suggest {
  position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 20; background: var(--raise);
  border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden auto; max-height: min(60vh, 460px);
  box-shadow: 0 14px 34px rgba(0,0,0,.35);
}
.suggest button {
  all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 8px 12px; cursor: pointer; border-bottom: 1px solid var(--line);
}
.suggest button:last-child { border-bottom: 0; }
.suggest button[aria-selected="true"], .suggest button:hover { background: var(--surface); }
.suggest .tag { margin-inline-start: auto; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.chip {
  all: unset; cursor: pointer; font-size: 13px; padding: 4px 10px; border-radius: 999px;
  border: 1px solid var(--line); color: var(--muted);
}
.chip:hover, .chip:focus-visible { color: var(--fg); border-color: var(--accent); }
.chip:focus-visible { outline: 2px solid var(--focus); }

.flag { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .04em; padding: 2px 8px; border-radius: 999px; border: 1px solid; margin-inline-start: 8px; vertical-align: 3px; }
.flag.vanilla { color: var(--vanilla); border-color: var(--vanilla); }
.flag.broken { color: var(--broken); border-color: var(--broken); }
.icoframe { border-radius: 10px; padding: 4px; border: 2px solid transparent; }
.icoframe.vanilla { border-color: var(--vanilla); }
.icoframe.broken { border-color: var(--broken); }

.prio { border: 0; margin: 10px 0 0; padding: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.prio legend { float: inline-start; font-size: 12.5px; color: var(--muted); margin-inline-end: 4px; padding: 0; }
.prio label { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; padding: 4px 10px; border-radius: 999px;
  border: 1px solid var(--line); color: var(--muted); cursor: pointer; user-select: none; }
.prio input { accent-color: var(--accent); margin: 0; }
.prio label:has(input:checked) { color: var(--fg); border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
.prio label:has(input:focus-visible) { outline: 2px solid var(--focus); }
.prio .reset { all: unset; cursor: pointer; font-size: 12.5px; color: var(--accent); margin-inline-start: 4px; }
.prio .reset:focus-visible { outline: 2px solid var(--focus); }

/* ---------- weapon tags, damage scale, category view */
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; }
.tg { all: unset; cursor: pointer; font-size: 12px; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); background: var(--surface); }
.tg:hover, .tg:focus-visible { color: var(--fg); border-color: var(--accent); }
.tg:focus-visible { outline: 2px solid var(--focus); }
.tg small { font-family: var(--font-mono); color: var(--accent); margin-inline-start: 3px; }
.tags .lbl, .sortbar .lbl { font-size: 12.5px; color: var(--muted); align-self: center; margin-inline-end: 2px; }
.dmg { font-family: var(--font-mono); font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
.sdmg { margin-inline-start: auto; }
.sdmg + .tag { margin-inline-start: 10px; }
.tagopt { background: color-mix(in srgb, var(--accent) 8%, transparent); }
.tagh { white-space: nowrap; }
.untag { all: unset; cursor: pointer; color: var(--muted); font-size: .8em; padding: 0 4px; border-radius: 6px; }
.untag:hover, .untag:focus-visible { color: var(--broken); outline: 1px solid var(--line); }
.tagdossier { grid-template-columns: minmax(0, 1fr); }
.sortbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 12px; }
.sortb { all: unset; cursor: pointer; font-size: 13px; padding: 4px 10px; border-radius: 8px; border: 1px solid var(--line); color: var(--muted); }
.sortb[aria-pressed="true"] { color: var(--fg); border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
.sortb:focus-visible { outline: 2px solid var(--focus); }

/* ---------- magazines */
.subh { font-family: var(--font-display); font-size: 16px; font-weight: 600; margin: 0 0 8px; }
.maglist { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; margin-bottom: 18px; }
.mag { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 10px; align-items: center; background: var(--surface);
  border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.mag.swap { border-color: color-mix(in srgb, var(--bad) 60%, var(--line)); }
.mag .name { font-weight: 500; overflow-wrap: anywhere; }
.mag .cap { font-family: var(--font-mono); font-size: 12.5px; color: var(--accent); white-space: nowrap; }
.mag .sub { font-size: 12.5px; color: var(--muted); }
.part .req { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
.mag .warn { font-size: 12px; font-weight: 600; color: var(--bad); }
.mag strong.bad { color: var(--bad); font-weight: 700; }
.swapnote { color: var(--bad); border-inline-start: 3px solid var(--bad); padding-inline-start: 10px; }

/* ---------- left column: categories */
.side summary { display: none; }
.side h4 { font-family: var(--font-display); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); margin: 0 0 6px; }
.side ul { list-style: none; margin: 0 0 18px; padding: 0; }
.sitem { all: unset; box-sizing: border-box; cursor: pointer; display: flex; align-items: baseline; gap: 8px; width: 100%;
  padding: 5px 8px; border-radius: 7px; font-size: 14px; color: var(--fg); }
.sitem.sub { padding-inline-start: 22px; font-size: 13px; color: var(--muted); }
.sitem small { margin-inline-start: auto; font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); }
.sitem:hover { background: var(--surface); color: var(--fg); }
.sitem:focus-visible { outline: 2px solid var(--focus); }
.sitem[aria-pressed="true"] { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--fg); box-shadow: inset 3px 0 var(--accent); }
[dir="rtl"] .sitem[aria-pressed="true"] { box-shadow: inset -3px 0 var(--accent); }
.sitem.off { opacity: .38; cursor: not-allowed; }
.sitem.off:hover { background: none; }
.clearf { all: unset; cursor: pointer; display: block; margin: 0 0 12px; padding: 5px 10px; border-radius: 7px; font-size: 13px;
  color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--line)); }
.clearf:hover, .clearf:focus-visible { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.clearf:focus-visible { outline: 2px solid var(--focus); }
@media (max-width: 860px) {
  /* narrow screen: one column, the page scrolls normally */
  body:has(.app) { overflow: auto; }
  .app { height: auto; display: flex; flex-direction: column; gap: 12px; }
  .langcell { order: -1; align-self: flex-end; }
  .lang { width: auto; }
  .side, .content, .rail { overflow: visible; }
  .side { padding: 6px 12px 10px; }
  .content { padding: 0 12px 20px; }
  .side summary { display: list-item; cursor: pointer; font-family: var(--font-display); font-weight: 600; color: var(--accent); padding: 6px 0; }
  .side details[open] summary { margin-bottom: 8px; }
  .side ul { display: flex; flex-wrap: wrap; gap: 6px; }
  .side li { flex: none; }
  .sitem, .sitem.sub { width: auto; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; font-size: 13px; }
  [dir] .sitem[aria-pressed="true"] { box-shadow: none; border-color: var(--accent); }
}

/* ---------- icons: 32px pixel art, drawn crisp */
.ico { width: 32px; height: 32px; flex: none; image-rendering: pixelated; object-fit: contain; }
.ico.lg { width: 72px; height: 72px; }
.ico.none { display: grid; place-items: center; border-radius: 6px; background: var(--raise); color: var(--muted); font-family: var(--font-display); font-size: 11px; }
.ico.lg.none { font-size: 16px; }

/* ---------- dossier header */
.dossier { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px; align-items: center; padding-block: 22px 18px; }
.dossier .kicker { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
.dossier h2 { font-family: var(--font-display); font-weight: 600; font-size: clamp(22px, 4vw, 32px); margin: 2px 0 10px; text-wrap: balance; }
.stats { display: flex; flex-wrap: wrap; gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; min-width: 0; }
.stat b { display: block; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.stat span { font-family: var(--font-mono); font-size: 14px; font-variant-numeric: tabular-nums; }
.note { color: var(--muted); font-size: 13px; margin: 0 0 18px; max-width: 70ch; }

/* ---------- groups of attachments */
.groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 14px; }
.group { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 12px 6px; min-width: 0; }
.group h3 { font-family: var(--font-display); font-size: 16px; font-weight: 600; margin: 0; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.group h3 small { font-family: var(--font-body); font-size: 11.5px; font-weight: 500; color: var(--muted); }
.group ul { list-style: none; margin: 8px 0 0; padding: 0; }
.part {
  all: unset; box-sizing: border-box; display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 10px;
  align-items: center; width: 100%; padding: 7px 6px; border-top: 1px solid var(--line); cursor: pointer; border-radius: 6px;
}
.part:hover { background: var(--raise); }
.part:focus-visible { outline: 2px solid var(--focus); }
.part .name { font-weight: 500; overflow-wrap: anywhere; }
.part.best .name::before {
  content: attr(data-best); display: inline-block; margin-inline-end: 8px; padding: 1px 7px; border-radius: 999px;
  background: var(--accent); color: var(--accent-ink); font-size: 10.5px; font-weight: 600; letter-spacing: .04em; vertical-align: 1px;
}
.part.dim { opacity: .55; }
.badges { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 3px; }
.badge { font-family: var(--font-mono); font-size: 11.5px; padding: 0 6px; border-radius: 5px; border: 1px solid var(--line); white-space: nowrap; }
.badge.good { color: var(--good); border-color: color-mix(in srgb, var(--good) 45%, var(--line)); }
.badge.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
.badge.neutral { color: var(--muted); }
.more { all: unset; cursor: pointer; display: block; color: var(--accent); font-size: 13px; padding: 8px 6px; }
.more:focus-visible { outline: 2px solid var(--focus); }

/* ---------- weapons list (attachment view) */
.wgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
.wcard {
  all: unset; box-sizing: border-box; display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 10px; align-items: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; cursor: pointer;
}
.wcard:hover { border-color: var(--accent); }
.wcard.vanilla { border: 2px solid var(--vanilla); }
.wcard.broken { border: 2px solid var(--broken); }
.suggest button.vanilla .ico, .suggest button.broken .ico { border-radius: 5px; outline: 2px solid; outline-offset: 1px; }
.suggest button.vanilla .ico { outline-color: var(--vanilla); }
.suggest button.broken .ico { outline-color: var(--broken); }
.wcard:focus-visible { outline: 2px solid var(--focus); }
.wcard .ico { width: 40px; height: 40px; }
.wcard .name { font-weight: 500; overflow-wrap: anywhere; }
.wcard .sub { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.filter { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
.filter input { font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; min-width: 0; flex: 1 1 220px; }
.filter input:focus { outline: 2px solid var(--focus); }
.count { color: var(--muted); font-size: 13px; }
footer { margin-top: 32px; color: var(--muted); font-size: 12.5px; border-top: 1px solid var(--line); padding-top: 14px; max-width: 80ch; }
footer p { margin: 0 0 6px; }
footer a { color: var(--accent); }
@media (prefers-reduced-motion: no-preference) { .part, .wcard, .chip { transition: background-color .12s, border-color .12s, color .12s; } }
@media (max-width: 520px) {
  .dossier { grid-template-columns: 1fr; }
  .groups { grid-template-columns: 1fr; }
  .brand h1 { font-size: 22px; }
}
</style>
</head>
<body>


<div class="app">
  <header class="top">
    <div class="brand"><h1 id="h1"></h1><p id="tagline"></p></div>
    <div class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 3a7 7 0 0 1 5.6 11.2l4.6 4.6-1.4 1.4-4.6-4.6A7 7 0 1 1 10 3zm0 2a5 5 0 1 0 0 10 5 5 0 0 0 0-10z"/></svg>
      <input id="q" type="search" autocomplete="off" spellcheck="false" aria-controls="suggest" aria-expanded="false">
      <div id="suggest" class="suggest" role="listbox" hidden></div>
    </div>
    <div class="chips" id="examples"></div>
    <fieldset class="prio" id="prio"><legend data-t="prioLegend"></legend></fieldset>
  </header>
  <div class="langcell"><select id="lang" class="lang" aria-label="Language"></select></div>
  <nav id="side" class="side panel"></nav>
  <main id="main" class="content panel">
    <div id="view"></div>
    <footer><p id="source"></p></footer>
  </main>
  <aside class="rail">
    <section class="legendbox panel" aria-labelledby="legend-h">
      <h4 id="legend-h" data-t="legend"></h4>
      <ul class="keys">
        <li><span class="key vanilla"></span><span data-t="keyVanilla"></span></li>
        <li><span class="key broken"></span><span data-t="keyBroken"></span></li>
        <li><span class="key swap"></span><span id="key-swap"></span></li>
        <li><span class="adot v"></span><span data-t="ammoVanilla"></span></li>
        <li><span class="adot m"></span><span data-t="ammoMod"></span></li>
        <li><span class="bestpill" data-t="best"></span></li>
      </ul>
      <div class="scale" aria-hidden="true"></div>
      <p class="small" data-t="dmgNote"></p>
      <p class="small" id="key-signs"></p>
    </section>

  let lang = detectLang();

  const kindName = (id) => L.kinds[id] || KIND[id].n;

  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const norm = (s) => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^\p{L}\p{N}]+/gu, "");
  const fmt = (v) => (Number.isInteger(v) ? String(v) : String(Math.round(v * 100) / 100)).replace("-", "−");
  const sign = (v) => (v > 0 ? "+" : "") + fmt(v);

  // ---------- automatic weapon tags (type, family, fire mode); names in LANGS order
  const TAG_ORDER = ["handgun", "pistol", "revolver", "smg", "rifle", "assault", "sniper", "mg", "shotgun", "archery", "bow", "crossbow", "slingshot",
    "explosive", "ugl", "flamer", "melee", "longblade", "shortblade", "axe", "blunt", "spear", "blade", "bayonet", "nonlethal", "swap", "auto", "burst", "sa", "cpc", "mc", "multi"];
  const TAGN = {

    revolver: ["Revolver", "Revolver", "Revolver", "Revolver", "Revólver", "مسدس دوّار", "Револьвер", "Револьвер", "左轮手枪", "リボルバー"],

    blade: ["Tranchante", "Bladed", "Mit Klinge", "Da taglio", "Cortante", "حادّ", "Ріжуча", "Режущее", "利刃", "刃物"],
    bayonet: ["Baïonnette", "Bayonet", "Bajonett", "Baionetta", "Bayoneta", "حربة", "Багнет", "Штык", "刺刀", "銃剣"],
    swap: ["Munitions converties", "Converted ammo", "Umgestellte Munition", "Munizioni convertite", "Munición convertida", "ذخيرة محوّلة", "Замінені набої", "Заменённые патроны", "弹药已替换", "弾薬変換"],
    nonlethal: ["Non létal", "Non-lethal", "Nicht tödlich", "Non letale", "No letal", "غير قاتل", "Нелетальна", "Нелетальное", "非致命", "非致死"],
    auto: ["Automatique (AUTO)", "Full auto", "Vollautomatisch", "Automatico", "Automático", "آلي", "Автоматичний вогонь", "Автоматический огонь", "全自动", "フルオート"],
    burst: ["Rafale", "Burst", "Feuerstoß", "Raffica", "Ráfaga", "رشقات", "Черга з відсіченням", "Очередь с отсечкой", "点射", "バースト"],
    sa: ["Semi-auto (SA)", "Semi-auto", "Halbautomatisch", "Semiautomatico", "Semiautomático", "نصف آلي", "Напівавтомат", "Полуавтомат", "半自动", "セミオート"],
    cpc: ["Coup par coup (CPC)", "Manual action", "Repetierer", "Azione manuale", "Acción manual", "تلقيم يدوي", "Ручне перезаряджання", "Ручная перезарядка", "手动上膛", "手動装填"],
    mc: ["Mono-coup (MC)", "Single shot", "Einzellader", "Colpo singolo", "Un solo disparo", "طلقة واحدة", "Однозарядна", "Однозарядное", "单发", "単発"],
    multi: ["Multi-tir", "Selective fire", "Feuerwahl", "Fuoco selettivo", "Fuego selectivo", "متعدد الأوضاع", "Кілька режимів", "Несколько режимов", "多模式射击", "射撃モード切替"],
  };
  // extra search words, whatever the language (abbreviations, common spellings)
  const TAG_ALIAS = {
    handgun: "poing pistolet pistol handgun", smg: "smg pm mitraillette pdw", assault: "assault assaut ar", sniper: "sniper snipper precision dmr",
    mg: "mg lmg mitrailleuse minigun", shotgun: "pompe chasse calibre12 shotgun", archery: "arc bow arbalete crossbow archery",
    explosive: "roquette rocket rpg law", ugl: "grenade lance-grenades launcher m203", flamer: "flamme flame", melee: "melee corps",
    blade: "couteau knife lame tranchant", auto: "auto automatique full", burst: "rafale burst", sa: "sa semi", cpc: "cpc bolt pump lever verrou pompe levier",
    mc: "mc single unique", multi: "multi selectif", swap: "conversion converti swap",
  };
  // calibre categories "k<n>": one per round really loaded (after the mod's swaps), added to each weapon's tags
  const CALS = [];
  D.weapons.forEach((w) => (w.a || []).forEach((a) => { if (!CALS.includes(a)) CALS.push(a); }));
  CALS.forEach((a, n) => TAG_ORDER.push("k" + n));
  D.weapons.forEach((w) => { w.t = (w.t || []).concat((w.a || []).map((a) => "k" + CALS.indexOf(a))); });
  const isCal = (id) => id[0] === "k" && CALS[+id.slice(1)] !== undefined;
  // short calibre: ".308", "5.56 mm", ".38 special" - the part of the game name from its first number on
  function calShort(a) {
    if (/calibre 12|shotgun|shell/i.test(a)) return t("gauge12");
    const m = /(?:^|\s)(\.?\d.*)$/.exec(a);
    if (m) return m[1].replace(/\s*(rounds?|ammo|box)$/i, "");
    return nm(a).replace(/_/g, " ");
  }
  const tagName = (id) => (isCal(id) ? calShort(CALS[+id.slice(1)]) : TAGN[id][LANGS.indexOf(lang)] || TAGN[id][1]);
  const TAGW = {};       // weapons by tag
  D.weapons.forEach((w, i) => (w.t || []).forEach((g) => (TAGW[g] = TAGW[g] || []).push(i)));

  // damage: colour from red (weak) to green (strong) and bigger type, by rank among all weapons
  const DMG = D.weapons.map((w) => w.dm || 0).filter((v) => v > 0).sort((a, b) => a - b);
  function dmgPct(v) {
    if (!v || !DMG.length) return 0;
    let lo = 0, hi = DMG.length;
    while (lo < hi) { const mid = (lo + hi) >> 1; DMG[mid] < v ? (lo = mid + 1) : (hi = mid); }
    return DMG.length > 1 ? lo / (DMG.length - 1) : 1;
  }
  function dmgHtml(w, base, span) {
    if (!w.d) return "—";
    const p = Math.min(1, dmgPct(w.dm));
    return `<span class="dmg" style="color:hsl(${Math.round(p * 125)} 55% 64%);font-size:${(base + p * span).toFixed(1)}px">${esc(w.d)}</span>`;
  }

  function icon(key, cls = "") {
    const src = key && D.icons[key];
    if (src) return `<img class="ico ${cls}" src="${src}" alt="" loading="lazy">`;
    return `<span class="ico none ${cls}" aria-hidden="true">?</span>`;
  }

  // stat badges: green = helps, red = hurts (recoil and reload: lower is better)
  const STATS = CFG.stats.map(([k, d]) => [k, d]);
  const UNIT = Object.fromEntries(CFG.stats.map(([k, , u]) => [k, u || ""]));

  // ranking criteria, in priority order; Eve's own choice (comfort and efficiency) is the default
  const CRIT = STATS.map(([k]) => k).filter((k) => k !== "pierce" && k !== "jam");
  const DEFAULT = CFG.defaults.filter((k) => CRIT.includes(k));
  let chosen = DEFAULT.slice();
  try {
    const saved = JSON.parse(localStorage.getItem(PFX + "prio") || "null");
    if (Array.isArray(saved) && saved.every((k) => CRIT.includes(k))) chosen = saved;
  } catch (e) { /* storage is a convenience */ }
  const DIR = Object.fromEntries(STATS);
  const gain = (p, k) => (p.s[k] || 0) * DIR[k];              // > 0 = this stat improves, < 0 = it gets worse
  // a stat's usual size among all attachments (90th percentile), so recoil −2 and reload +10 weigh comparably
  const SCALE = Object.fromEntries(CRIT.map((k) => {
    const v = D.parts.map((p) => Math.abs(p.s[k] || 0)).filter((x) => x > 0).sort((a, b) => a - b);
    return [k, v.length ? v[Math.min(v.length - 1, Math.floor(v.length * 0.9))] : 1];
  }));
  // net score over the chosen criteria: bonuses minus penalties (a suppressor's +10 reload counts against it)
  const score = (p, keys) => keys.reduce((sum, k) => sum + gain(p, k) / SCALE[k], 0);
  const helpsChosen = (p) => score(p, chosen) > 0;
  function sortParts(ids) {
    const others = CRIT.filter((k) => !chosen.includes(k));
    return ids.slice().sort((a, b) => {
      const pa = D.parts[a], pb = D.parts[b];
      return (score(pb, chosen) - score(pa, chosen))
        || (score(pb, others) - score(pa, others))          // unchecked criteria only break ties
        || ((pa.s.weight || 0) - (pb.s.weight || 0))        // then the lighter part
        || pa.n.localeCompare(pb.n);
    });
  }
  function badges(s) {
    const out = STATS.filter(([k]) => s[k]).map(([k, dir]) => {
      const good = s[k] * dir > 0;
      const v = UNIT[k] === "×" ? `×${fmt(s[k])}` : sign(s[k]) + UNIT[k];
      return `<span class="badge ${good ? "good" : "bad"}">${esc(L.stat[k])} ${v}</span>`;
    });
    return out.length ? out.join("") : `<span class="badge neutral">${esc(t("noBonus"))}</span>`;
  }

  const flagClass = (w) => (w.x ? "broken" : w.v ? "vanilla" : "");
  const flagPill = (w) => (w.x ? `<span class="flag broken">${esc(t("keyBroken"))}</span>` : w.v ? `<span class="flag vanilla">${esc(t("pillVanilla"))}</span>` : "");
  const flagTitle = (w) => (w.x ? t("keyBroken") : w.v ? t("keyVanilla") : "");
  let searchIndex = [];
  function buildIndex() {
    // the original (game) name stays searchable whatever the page language
    searchIndex = [
      ...D.weapons.map((w, i) => ({ t: "w", i, n: nm(w.n), key: norm(nm(w.n) + " " + w.n), ico: w.i,
        tag: t("weapon") + (w.x ? " · " + t("tagBroken") : w.v ? " · " + t("tagBase") : ""), cls: flagClass(w) })),
      ...D.parts.map((p, i) => ({ t: "p", i, n: nm(p.n), key: norm(nm(p.n) + " " + p.n + " " + kindName(p.k) + " " + I18N.en.kinds[p.k]), ico: p.i, tag: kindName(p.k) })),
    ];
  }

  // ---------- weapon view
  let current = null;   // what is on screen, redrawn when the language or the criteria change
  function showWeapon(i, keepScroll) {
    current = ["w", i];
    const w = D.weapons[i];
    const crit = w.c[0] ? `${fmt(w.c[0])} %${w.c[1] ? ` · ×${fmt(w.c[1])}` : ""}` : "—";
    let html = `<section class="dossier"><div class="icoframe ${flagClass(w)}">${icon(w.i, "lg")}</div><div>
      <div class="kicker">${esc(t("weapon"))}</div><h2>${esc(nm(w.n))}${flagPill(w)}</h2>
      ${tagChips(w)}
      <div class="stats">
        <div class="stat"><b>${esc(L.crit.dmg)}</b><span>${dmgHtml(w, 15, 9)}</span></div>
        <div class="stat"><b>${esc(t("critStat"))}</b><span>${esc(crit)}</span></div>
        <div class="stat"><b>${esc(L.crit.range)}</b><span>${esc(w.r || "—")}</span></div>
        <div class="stat"><b>${esc(t("ammo"))}</b><span>${w.a.map(amm).join(", ") || "—"}</span></div>
      </div></div></section>`;
    const fam = D.fam && w.a && D.fam[w.a[0]];
    if (fam) html += `<h3 class="subh">${esc(t("ammoTitle"))}</h3><div class="maglist">${fam.map((x) => `<div class="mag">${icon(x.i)}<span>
        <span class="name">${amm(x.n)}</span><br><span class="badges">${badges(x.s)}</span></span></div>`).join("")}</div>`;
    if (w.ao) html += `<p class="note swapnote">${esc(t("swapNote", { o: w.ao.map(nm).join(", "), a: w.a.map(nm).join(", ") }))}</p>`;
    if (w.mg && w.mg.length) {
      html += `<h3 class="subh">${esc(t("mags"))}</h3><div class="maglist">${w.mg.map((g) => `<div class="mag${g.o ? " swap" : ""}">${icon(g.i)}<span>
        <span class="name">${esc(nm(g.n))}</span>${g.c ? ` <span class="cap">${esc(t("rounds", { n: g.c }))}</span>` : ""}<br>
        <span class="sub">${esc(t("loads", { a: "\u0000" })).replace("\u0000", g.o ? `<strong class="bad">${amm(g.a)}</strong>` : amm(g.a))}</span>${g.o ? `<br><span class="warn">${esc(t("swapMag"))}</span>` : ""}</span></div>`).join("")}</div>`;
    }
    if (w.x) html += `<p class="note" style="color:var(--broken)">${esc(t("brokenNote"))}</p>`;
    const kinds = D.kinds.filter((k) => (w.p[k.id] || []).length);
    if (!kinds.length) {
      html += `<p class="note">${esc(t("noParts"))}</p>`;
    } else {
      const crit = CRIT.filter((k) => chosen.includes(k)).map((k) => L.crit[k].toLocaleLowerCase(lang)).join(t("then"));
      html += `<p class="note">${esc(t("intro", { n: kinds.length, crit: crit || t("noneChecked") }))}</p><div class="groups">`;
      // parts that need another one first: only name the ones this weapon can take
      const onW = new Set(Object.values(w.p).flat().map((i) => D.parts[i].n));
      for (const k of kinds) {
        const ids = sortParts(w.p[k.id]);
        const shared = D.kinds.filter((o) => o.slot === k.slot && o.id !== k.id && (w.p[o.id] || []).length).map((o) => kindName(o.id));
        html += `<section class="group"><h3>${esc(kindName(k.id))} <small>${ids.length} · ${esc(t("slot", { s: k.slot }))}${shared.length ? ` (${esc(t("shared", { l: shared.join(", ") }))})` : ""}</small></h3><ul>`;
        ids.forEach((pi, n) => {
          const p = D.parts[pi];
          const useful = STATS.some(([key, dir]) => p.s[key] && p.s[key] * dir > 0);
          html += `<li${n >= 5 ? ' data-extra hidden' : ""}><button class="part${n === 0 && helpsChosen(p) ? " best" : ""}${useful ? "" : " dim"}" data-p="${pi}">
            ${icon(p.i)}<span><span class="name" data-best="${esc(t("best"))}">${esc(nm(p.n))}</span><span class="badges">${badges(p.s)}</span>${reqHtml(p, onW)}</span></button></li>`;
        });
        html += `</ul>${ids.length > 5 ? `<button class="more" data-more>${esc(t("more", { n: ids.length - 5 }))}</button>` : ""}</section>`;
      }
      html += `</div>`;
    }
    view.innerHTML = html;
    setHash(`w${i}`, keepScroll);
  }

  // ---------- attachment view
  function showPart(i, keepScroll) {
    current = ["p", i];
    const p = D.parts[i];
    const k = KIND[p.k];
    let html = `<section class="dossier">${icon(p.i, "lg")}<div>
      <div class="kicker">${esc(kindName(p.k))} · ${esc(t("slot", { s: k.slot }))}</div><h2>${esc(nm(p.n))}</h2>
      <div class="badges" style="gap:8px">${badges(p.s)}</div></div></section>
      <div class="filter"><input id="wf" type="search" placeholder="${esc(t("filterPh", { n: p.w.length }))}" aria-label="${esc(t("filterAria"))}"><span class="count" id="wcount"></span></div>
      <div class="wgrid" id="wgrid"></div>`;
    view.innerHTML = html;
    const grid = document.getElementById("wgrid");
    const count = document.getElementById("wcount");
    const draw = (f) => {
      const nf = norm(f || "");
      const list = p.w.filter((wi) => !nf || norm(nm(D.weapons[wi].n) + " " + D.weapons[wi].n).includes(nf));
      grid.innerHTML = list.map(wcard).join("") || `<p class="note">${esc(t("noMatch", { f }))}</p>`;
      count.textContent = list.length === 1 ? t("count1") : t("count", { n: list.length });
    };
    document.getElementById("wf").addEventListener("input", (e) => draw(e.target.value));
    draw("");
    setHash(`p${i}`, keepScroll);
  }

  function reqHtml(p, onW) {
    const need = (p.req || []).filter((x) => onW.has(x));
    return need.length ? `<span class="req">${esc(t("requires", { x: need.map(nm).join(" / ") }))}</span>` : "";
  }
  function wcard(wi) {
    const w = D.weapons[wi];
    const bits = [`${esc(L.stat.dmg)} ${dmgHtml(w, 13, 7)}`];
    if (w.cap) bits.push(`${esc(t("capShort"))} ${w.cap}`);
    if (w.r) bits.push(`${esc(L.stat.range)} ${esc(w.r)}`);
    return `<button class="wcard ${flagClass(w)}" data-w="${wi}" title="${esc(flagTitle(w))}">${icon(w.i)}<span><span class="name">${esc(nm(w.n))}</span><br><span class="sub">${bits.join(" · ")}</span>${w.a.length ? `<br><span class="sub">${amm(w.a[0])}</span>` : ""}</span></button>`;
  }
  function tagChips(w) {
    const ts = TAG_ORDER.filter((g) => (w.t || []).includes(g));
    return ts.length ? `<div class="tags">${ts.map((g) => `<button class="tg" data-tag="${g}">${esc(tagName(g))}</button>`).join("")}</div>` : "";
  }

  // ---------- tag view: every weapon of one or several categories, sortable
  const matching = (tags) => (tags.length ? TAGW[tags[0]].filter((wi) => tags.every((g) => D.weapons[wi].t.includes(g))) : D.weapons.map((w, i) => i));
  const SORTS = { dmg: (w) => -(w.dm || 0), cap: (w) => -(w.cap || 0), range: (w) => -(+w.r || 0), name: null };
  let sortBy = "dmg";
  function showTags(tags, keepScroll) {
    tags = TAG_ORDER.filter((g) => tags.includes(g) && TAGW[g]);
    current = ["t", tags];
    let list = matching(tags);
    const key = SORTS[sortBy];
    list = list.slice().sort((a, b) => {
      const wa = D.weapons[a], wb = D.weapons[b];
      return (key ? key(wa) - key(wb) : 0) || nm(wa.n).localeCompare(nm(wb.n));
    });
    // other categories present among these weapons, to narrow down
    const refine = TAG_ORDER.filter((g) => !tags.includes(g)).map((g) => [g, list.filter((wi) => D.weapons[wi].t.includes(g)).length])
      .filter(([, n]) => n > 0 && n < list.length);
    const sortBtn = (k, label) => `<button class="sortb" data-sort="${k}" aria-pressed="${sortBy === k}">${esc(label)}</button>`;
    view.innerHTML = `<section class="dossier tagdossier"><div>
      <div class="kicker">${esc(t("category"))}</div>
      <h2>${tags.length ? tags.map((g) => `<span class="tagh">${esc(tagName(g))} <button class="untag" data-untag="${g}" aria-label="${esc(t("remove"))} ${esc(tagName(g))}">×</button></span>`).join(" + ") : esc(t("allWeapons"))}</h2>
      <p class="note">${esc(t("tagCount", { n: list.length }))} · ${esc(t("dmgNote"))}</p>
      ${refine.length ? `<div class="tags refine"><span class="lbl">${esc(t("refine"))}</span>${refine.map(([g, n]) => `<button class="tg" data-addtag="${g}">${esc(tagName(g))} <small>${n}</small></button>`).join("")}</div>` : ""}
      </div></section>
      <div class="sortbar"><span class="lbl">${esc(t("sortBy"))}</span>${sortBtn("dmg", L.crit.dmg)}${sortBtn("cap", t("mags"))}${sortBtn("range", L.crit.range)}${sortBtn("name", t("sName"))}</div>
      <div class="wgrid">${list.map(wcard).join("") || `<p class="note">${esc(t("noCombo"))}</p>`}</div>`;
    setHash("t" + tags.join(","), keepScroll);
  }

  // ---------- left column: categories, sub-categories indented under their family
  const SIDE = [["sideTypes", [["handgun", ["pistol", "revolver"]], ["smg"], ["rifle", ["assault", "sniper", "mg"]], ["shotgun"],
    ["archery", ["bow", "crossbow", "slingshot"]], ["explosive"], ["ugl"], ["flamer"], ["melee", ["longblade", "shortblade", "axe", "blunt", "spear"]], ["blade", ["bayonet"]], ["nonlethal"], ["swap"]]],
    ["sideModes", [["auto"], ["burst"], ["sa"], ["cpc"], ["mc"], ["multi"]]],
    ["sideCal", CALS.map((a, n) => ["k" + n])]];
  const side = document.getElementById("side");
  // alphabetical in the page language
  const byName = (list) => list.slice().sort((a, b) => tagName(a[0]).localeCompare(tagName(b[0]), lang));
  const activeTags = () => (current && current[0] === "t" ? current[1] : []);
  function drawSide() {
    const on = activeTags();
    const base = on.length ? matching(on) : null;
    const item = (g, sub) => {
      if (!TAGW[g]) return "";
      const sel = on.includes(g);
      const n = base ? (sel ? base.length : base.filter((wi) => D.weapons[wi].t.includes(g)).length) : TAGW[g].length;
      const off = !sel && n === 0;
      return `<li><button class="sitem${sub ? " sub" : ""}${off ? " off" : ""}" data-side="${g}" aria-pressed="${sel}"${off ? ` aria-disabled="true" title="${esc(t("noCombo"))}"` : ` title="${esc(t("sideHint"))}"`}><span>${isCal(g) ? ammoDot(CALS[+g.slice(1)]) : ""}${esc(tagName(g))}</span><small>${n}</small></button></li>`;
    };
    // keep the open/closed state across redraws; closed at first on a narrow screen
    const prev = document.getElementById("sidebox");
    const open = prev ? prev.open : !matchMedia("(max-width: 860px)").matches;
    side.innerHTML = `<details id="sidebox"${open ? " open" : ""}><summary>${esc(t("sideTypes"))}${on.length ? ` · ${on.length}` : ""}</summary>`
      + (on.length ? `<button class="clearf" data-clear>${esc(t("clearFilters"))} (${on.length})</button>` : "") + SIDE.map(([title, groups]) =>
      `<h4>${esc(t(title))}</h4><ul>${byName(groups).map(([g, subs]) => item(g) + byName((subs || []).map((x) => [x])).map(([x]) => item(x, true)).join("")).join("")}</ul>`).join("") + `</details>`;
  }
  const markSide = () => drawSide();
  side.addEventListener("click", (e) => {
    if (e.target.closest("[data-clear]")) return showTags([]);
    const b = e.target.closest("[data-side]");
    if (!b || b.getAttribute("aria-disabled") === "true") return;
    const g = b.dataset.side, on = activeTags();
    showTags(on.includes(g) ? on.filter((x) => x !== g) : on.concat(g));
  });

  // the content block scrolls by itself on a wide screen, the whole page on a narrow one
  const mainEl = document.getElementById("main");
  const narrow = () => matchMedia("(max-width: 860px)").matches;
  const scroller = () => (narrow() ? window : mainEl);

  // ---------- history: last views, shown under the search bar
  let hist = [];
  try { hist = JSON.parse(localStorage.getItem(PFX + "hist") || "[]").filter((h) => typeof h === "string"); } catch (e) { /* convenience */ }
  function histLabel(h) {
    const k = h[0], rest = h.slice(1);
    if (k === "w" && D.weapons[+rest]) return nm(D.weapons[+rest].n);
    if (k === "p" && D.parts[+rest]) return nm(D.parts[+rest].n);
    if (k === "t") { const g = rest.split(",").filter((x) => TAGW[x]); return "# " + (g.length ? g.map(tagName).join(" + ") : t("allWeapons")); }
    return "";
  }
  function remember(h) {
    hist = [h].concat(hist.filter((x) => x !== h)).slice(0, 8);
    try { localStorage.setItem(PFX + "hist", JSON.stringify(hist)); } catch (e) { /* convenience */ }
    drawExamples();
  }
  function go(h) {
    const k = h[0], rest = h.slice(1);
    if (k === "w") showWeapon(+rest);
    else if (k === "p") showPart(+rest);
    else if (k === "t") showTags(rest.split(",").filter(Boolean));
  }

  function setHash(h, keepScroll) {
    markSide();
    try { history.replaceState(null, "", "#" + h); } catch (e) { /* hash is a convenience */ }
    remember(h);
    if (!keepScroll) scroller().scrollTo({ top: 0 });
  }
  function redraw() {
    if (!current) return;
    if (current[0] === "t") showTags(current[1], true);
    else current[0] === "w" ? showWeapon(current[1], true) : showPart(current[1], true);
  }

  view.addEventListener("click", (e) => {
    const b = e.target.closest("[data-p],[data-w],[data-more],[data-tag],[data-addtag],[data-untag],[data-sort]");
    if (!b) return;
    if (b.dataset.tag) showTags([b.dataset.tag]);
    else if (b.dataset.addtag) showTags(current[1].concat(b.dataset.addtag));
    else if (b.dataset.untag) showTags(current[1].filter((g) => g !== b.dataset.untag), true);
    else if (b.dataset.sort) { sortBy = b.dataset.sort; showTags(current[1], true); }
    else if (b.hasAttribute("data-more")) {
      b.parentElement.querySelectorAll("[data-extra]").forEach((li) => (li.hidden = false));
      b.remove();
    } else if (b.dataset.p) showPart(+b.dataset.p);
    else showWeapon(+b.dataset.w);
  });

  // ---------- search
  let results = [], sel = -1;
  function suggest() {
    const nq = norm(q.value);
    if (!nq) return close();
    results = tagResults(q.value).concat(searchIndex
      .map((r) => ({ r, pos: r.key.indexOf(nq) }))
      .filter((x) => x.pos >= 0)
      .sort((a, b) => (a.pos !== b.pos ? a.pos - b.pos : a.r.n.length - b.r.n.length))
      .slice(0, 14).map((x) => x.r));
    sel = results.length ? 0 : -1;
    box.innerHTML = results.length
      ? results.map((r, n) => `<button role="option" class="${r.cls || ""}" id="opt${n}" aria-selected="${n === sel}" data-n="${n}">${r.t === "t" ? `<span class="ico none" aria-hidden="true">#</span>` : icon(r.ico)}<span>${esc(r.n)}</span>${r.t === "w" ? `<span class="sdmg">${dmgHtml(D.weapons[r.i], 12, 4)}</span>` : ""}<span class="tag">${esc(r.tag)}</span></button>`).join("")
      : `<div style="padding:12px;color:var(--muted)">${esc(t("nothing", { q: q.value }))}</div>`;
    box.hidden = false;
    q.setAttribute("aria-expanded", "true");
  }
  function tagWords(g) {
    const names = isCal(g) ? [tagName(g), CALS[+g.slice(1)]] : [tagName(g), TAGN[g][0], TAGN[g][1]];
    const words = names.concat([TAG_ALIAS[g] || ""]).join(" ");
    return words.split(/[\s()\/]+/).map(norm).filter(Boolean).concat(names.map(norm));
  }
  function tagResults(text) {
    const words = text.split(/\s+/).map(norm).filter((x) => x.length >= 2);
    if (!words.length) return [];
    const ids = TAG_ORDER.filter((g) => TAGW[g]);
    const per = words.map((wd) => {
      const exact = ids.filter((g) => tagWords(g).includes(wd));
      return exact.length ? exact : ids.filter((g) => tagWords(g).some((x) => x.startsWith(wd)));
    });
    if (per.some((m) => !m.length)) return [];
    const mk = (tags) => {
      const n = TAGW[tags[0]].filter((wi) => tags.every((g) => D.weapons[wi].t.includes(g))).length;
      return n ? { t: "t", tags, n: tags.map(tagName).join(" + "), ico: "", tag: `${t("category")} · ${n}`, cls: "tagopt" } : null;
    };
    if (words.length === 1) return per[0].slice(0, 4).map((g) => mk([g])).filter(Boolean);
    return [mk([...new Set(per.map((m) => m[0]))])].filter(Boolean);
  }
  function close() { box.hidden = true; q.setAttribute("aria-expanded", "false"); }
  function pick(n) {
    const r = results[n];
    if (!r) return;
    close(); q.value = ""; q.blur();
    if (r.t === "t") showTags(r.tags);
    else r.t === "w" ? showWeapon(r.i) : showPart(r.i);
  }
  function mark() {
    box.querySelectorAll("button").forEach((b, n) => b.setAttribute("aria-selected", n === sel));
    const cur = box.querySelector(`#opt${sel}`);
    if (cur) cur.scrollIntoView({ block: "nearest" });
  }
  q.addEventListener("input", suggest);
  q.addEventListener("focus", () => q.value && suggest());
  q.addEventListener("keydown", (e) => {
    if (box.hidden) return;
    if (e.key === "ArrowDown") { sel = Math.min(sel + 1, results.length - 1); mark(); e.preventDefault(); }
    else if (e.key === "ArrowUp") { sel = Math.max(sel - 1, 0); mark(); e.preventDefault(); }
    else if (e.key === "Enter") { pick(sel); e.preventDefault(); }
    else if (e.key === "Escape") close();
  });
  box.addEventListener("mousedown", (e) => { const b = e.target.closest("button"); if (b) { e.preventDefault(); pick(+b.dataset.n); } });
  document.addEventListener("click", (e) => { if (!e.target.closest(".search")) close(); });

  // ---------- criteria bar
  const prio = document.getElementById("prio");
  function drawPrio() {
    prio.querySelectorAll("label,.reset").forEach((e) => e.remove());
    CRIT.forEach((k) => {
      const l = document.createElement("label");
      l.innerHTML = `<input type="checkbox" id="prio-${k}" value="${k}"${chosen.includes(k) ? " checked" : ""}> ${esc(L.crit[k])}`;
      prio.appendChild(l);
    });
    const same = chosen.length === DEFAULT.length && DEFAULT.every((k) => chosen.includes(k));
    if (!same) {
      const r = document.createElement("button");
      r.className = "reset"; r.type = "button"; r.textContent = t("reset");
      prio.appendChild(r);
    }
  }
  function setChosen(list) {
    chosen = CRIT.filter((k) => list.includes(k));
    try { localStorage.setItem(PFX + "prio", JSON.stringify(chosen)); } catch (e) { /* convenience only */ }
    drawPrio();
    redraw();
  }
  prio.addEventListener("change", () => setChosen([...prio.querySelectorAll("input:checked")].map((i) => i.value)));
  prio.addEventListener("click", (e) => { if (e.target.closest(".reset")) setChosen(DEFAULT); });

  // ---------- example chips
  const EX = CFG.examples;
  const examples = document.getElementById("examples");
  function drawExamples() {
    // the recent views once there are some (the current one left out), the examples before that
    const recent = hist.slice(1).map((h) => [h, histLabel(h)]).filter(([, l]) => l);
    const list = recent.length ? recent : EX.map((n) => {
      const wi = D.weapons.findIndex((w) => w.n === n);
      const pi = wi < 0 ? D.parts.findIndex((p) => p.n === n) : -1;
      return wi >= 0 ? ["w" + wi, nm(n)] : pi >= 0 ? ["p" + pi, nm(n)] : null;
    }).filter(Boolean);
    const label = recent.length ? t("recent") : t("examples");
    examples.setAttribute("aria-label", label);
    examples.innerHTML = `<span class="recent-l">${esc(label)}</span>` + list.map(([h, l]) => `<button class="chip" data-h="${esc(h)}">${esc(l)}</button>`).join("");
  }
  examples.addEventListener("click", (e) => {
    const b = e.target.closest(".chip");
    if (b) go(b.dataset.h);
  });

  // ---------- language: follows the browser, the selector overrides it (remembered)
  const langSel = document.getElementById("lang");
  langSel.innerHTML = LANGS.map((l) => `<option value="${l}" lang="${l}">${esc(I18N[l].name)}</option>`).join("");
  function applyLang() {
    L = I18N[lang];
    const root = document.documentElement;
    root.lang = lang;
    root.dir = lang === "ar" ? "rtl" : "ltr";
    langSel.value = lang;
    document.title = t("title", { brand: CFG.brand }) + (CFG.port ? ` (${t("port")})` : "");
    document.getElementById("h1").innerHTML = t("h1", { brand: esc(CFG.brand) }) + (CFG.port ? ` <small class="port">(${esc(t("port"))})</small>` : "");
    document.getElementById("tagline").textContent = t("tagline", { mods: CFG.tagline });
    q.placeholder = t("ph");
    q.setAttribute("aria-label", t("searchAria"));
    document.querySelectorAll("[data-t]").forEach((el) => (el.textContent = t(el.dataset.t)));
    const mod = CFG.source.map((x) => `<a href="https://steamcommunity.com/sharedfiles/filedetails/?id=${encodeURIComponent(x.id)}" target="_blank" rel="noopener">${esc(x.n)} (Workshop ${esc(x.id)})</a>`).join(", ");
    document.getElementById("source").innerHTML = esc(t(CFG.source.length > 1 ? "sources" : "source", { mod: "\u0000" })).replace("\u0000", mod) + (lang === "zh" || lang === "ja" ? "。" : ".");
    document.getElementById("key-signs").textContent = t(CFG.signs, L.stat);
    document.getElementById("key-swap").textContent = tagName("swap");
    document.getElementById("key-swap").parentElement.hidden = !TAGW.swap;
    buildIndex();
    drawSide();
    drawPrio();
    drawExamples();
    close();
    redraw();
  }
  langSel.addEventListener("change", () => {
    lang = langSel.value;
    try { localStorage.setItem("armurerie.lang", lang); } catch (e) { /* convenience only */ }
    applyLang();
  });
  applyLang();

  // ---------- start
  const m = /^#([wp])(\d+)$/.exec(location.hash || "");
  const mt = /^#t([\w,]*)$/.exec(location.hash || "");
  if (mt) showTags(mt[1].split(",").filter(Boolean));
  else if (m && m[1] === "w" && D.weapons[+m[2]]) showWeapon(+m[2]);
  else if (m && m[1] === "p" && D.parts[+m[2]]) showPart(+m[2]);
  else {
    const start = D.weapons.findIndex((w) => w.n === CFG.start);
    showWeapon(start >= 0 ? start : 0);
  }
})();
</script>

</body>
